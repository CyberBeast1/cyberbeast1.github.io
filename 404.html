    <!-- inject post container div in place of <\!-- posts -\-> -->
  <script>

    (function replacePostsComment() {
  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_COMMENT,
    null,
    false
  );

  let node;
  while ((node = walker.nextNode())) {
    if (node.nodeValue.trim() === 'posts') {
      const container = document.createElement('div');
      container.className = 'posts-container';

      const search = document.createElement('div');
      search.className = 'posts-search';

      const list = document.createElement('div');
      list.className = 'posts-list';

      const pagination = document.createElement('div');
      pagination.className = 'posts-pagination';

      container.append(search, list, pagination);

      node.parentNode.replaceChild(container, node);
      break; // only replace the first <!-- posts -->
    }
  }
})();

   window.APP_CONFIG = {
      baseUrl: ""
    };
  </script>
